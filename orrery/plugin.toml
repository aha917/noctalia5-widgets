# Orrery: the solar system right now (planets, Moon, Chiron, galactic center) over the zodiac, as a desktop widget.
# render.py (Swiss Ephemeris + pycairo; system python3 or a .venv) draws a PNG that
# desktop.luau shows; Chiron comes from ephe/seas_18.se1.

id = "traditions/orrery"
name = "Orrery"
version = "1.6.0"
plugin_api = 24
author = "Traditions"
license = "AGPL-3.0-or-later"
dependencies = ["python3", "python-cairo", "pyswisseph"]
tags = ["astronomy", "planets", "zodiac", "desktop"]
icon = "planet"
description = "The solar system right now: planets, Moon, Chiron, lunar nodes, the galactic center and the Great Attractor over a tropical or sidereal zodiac, with positions."

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  description_key = "settings.size.description"
  default = 680
  min = 200
  max = 1400

  [[desktop_widget.setting]]
  key = "interval"
  type = "int"
  label_key = "settings.interval.label"
  description_key = "settings.interval.description"
  default = 60
  min = 5
  max = 600

  [[desktop_widget.setting]]
  key = "font"
  type = "string"
  label_key = "settings.font.label"
  description_key = "settings.font.description"
  default = "0xProto"

  [[desktop_widget.setting]]
  key = "table_font"
  type = "string"
  label_key = "settings.table_font.label"
  description_key = "settings.table_font.description"
  default = "0xProto"

  [[desktop_widget.setting]]
  key = "font_size"
  type = "int"
  label_key = "settings.font_size.label"
  description_key = "settings.font_size.description"
  default = 20
  min = 8
  max = 26

  [[desktop_widget.setting]]
  key = "zodiac"
  type = "select"
  label_key = "settings.zodiac.label"
  description_key = "settings.zodiac.description"
  default = "fagan-bradley"
  options = [
    { value = "fagan-bradley", label_key = "settings.zodiac.options.fagan-bradley" },
    { value = "tropical", label_key = "settings.zodiac.options.tropical" },
  ]

  [[desktop_widget.setting]]
  key = "order"
  type = "select"
  label_key = "settings.order.label"
  description_key = "settings.order.description"
  default = "heliocentric"
  options = [
    { value = "heliocentric", label_key = "settings.order.options.heliocentric" },
    { value = "geocentric", label_key = "settings.order.options.geocentric" },
  ]

  [[desktop_widget.setting]]
  key = "show_gc"
  type = "bool"
  label_key = "settings.show_gc.label"
  description_key = "settings.show_gc.description"
  default = true

  [[desktop_widget.setting]]
  key = "show_ga"
  type = "bool"
  label_key = "settings.show_ga.label"
  description_key = "settings.show_ga.description"
  default = true

  [[desktop_widget.setting]]
  key = "show_nodes"
  type = "bool"
  label_key = "settings.show_nodes.label"
  description_key = "settings.show_nodes.description"
  default = true

  [[desktop_widget.setting]]
  key = "zodiac_label"
  type = "bool"
  label_key = "settings.zodiac_label.label"
  description_key = "settings.zodiac_label.description"
  default = true

  [[desktop_widget.setting]]
  key = "zodiac_font_size"
  type = "int"
  label_key = "settings.zodiac_font_size.label"
  description_key = "settings.zodiac_font_size.description"
  default = 20
  min = 6
  max = 40
  visible_when = { key = "zodiac_label", values = ["true"] }
