# Ephemeris: sidereal (Fagan/Bradley and Lahiri) positions of the Sun, Moon and
# planets with motion, dignity and nakshatra, plus a summary of the highlights.
# render.py (Swiss Ephemeris + pycairo; system python3 or a .venv) draws a PNG
# that desktop.luau shows.

id = "traditions/ephemeris"
name = "Ephemeris"
version = "1.3.0"
plugin_api = 24
author = "Traditions"
license = "AGPL-3.0-or-later"
dependencies = ["python3", "python-cairo", "pyswisseph"]
tags = ["astronomy", "astrology", "desktop"]
icon = "planet"
description = "Sidereal positions (Fagan/Bradley, Lahiri) with retrograde, stations, dignities, nakshatras and highlights."

# Pop-up for typing a date and time, opened by clicking the date on the widget
# (a desktop widget never gets the keyboard).
[[panel]]
id = "time"
entry = "time.luau"
width = 320
height = 140
placement = "floating"
position = "center"

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

  [[desktop_widget.setting]]
  key = "size"
  type = "int"
  label_key = "settings.size.label"
  description_key = "settings.size.description"
  default = 680
  min = 200
  max = 1400

  [[desktop_widget.setting]]
  key = "interval"
  type = "int"
  label_key = "settings.interval.label"
  description_key = "settings.interval.description"
  default = 60
  min = 10
  max = 600

  [[desktop_widget.setting]]
  key = "primary"
  type = "string"
  label_key = "settings.primary.label"
  description_key = "settings.primary.description"
  default = "Fagan/Bradley"

  [[desktop_widget.setting]]
  key = "font"
  type = "string"
  label_key = "settings.font.label"
  description_key = "settings.font.description"
  default = "0xProto"

  [[desktop_widget.setting]]
  key = "font_size"
  type = "int"
  label_key = "settings.font_size.label"
  description_key = "settings.font_size.description"
  default = 20
  min = 8
  max = 26

  [[desktop_widget.setting]]
  key = "sign_size"
  type = "int"
  label_key = "settings.sign_size.label"
  description_key = "settings.sign_size.description"
  default = 31
  min = 8
  max = 60

  [[desktop_widget.setting]]
  key = "planet_size"
  type = "int"
  label_key = "settings.planet_size.label"
  description_key = "settings.planet_size.description"
  default = 32
  min = 8
  max = 60

  [[desktop_widget.setting]]
  key = "sanskrit"
  type = "bool"
  label_key = "settings.sanskrit.label"
  description_key = "settings.sanskrit.description"
  default = false

  [[desktop_widget.setting]]
  key = "order"
  type = "select"
  label_key = "settings.order.label"
  description_key = "settings.order.description"
  default = "heliocentric"
  options = [
    { value = "heliocentric", label_key = "settings.order.options.heliocentric" },
    { value = "geocentric", label_key = "settings.order.options.geocentric" },
  ]
